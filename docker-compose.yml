services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  fetcher:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db
volumes:
  pgdata:
